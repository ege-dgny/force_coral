name: forte
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24
  - scipy>=1.10
  - pip
  - pip:
    - torch>=2.0
    - mujoco>=2.3
    - robosuite>=1.4
    - openai>=1.0
    - python-dotenv
    - Pillow
    - trimesh
    - opencv-python
    - "imageio[ffmpeg]"
    - matplotlib
    - transformations
    - pytest
    - pytest-cov
